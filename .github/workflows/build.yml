# SPDX-License-Identifier: GPL-3.0-only
# JUNGLE: test, build the firmware and the browser emulator, and publish the site (installer, loader, manual) to the
# gh-pages branch. On every push to main, and by hand (Actions -> Build -> Run workflow).
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Python and Node packages
        run: |
          sudo apt-get install -y -qq libfribidi0 libraqm0 > /dev/null
          python3 -m pip install --break-system-packages -q Pillow fonttools
          npm install --no-save --silent playwright@1
          npx playwright install --with-deps chromium > /dev/null

      - name: Tests (engine, host simulator, loader page)
        run: sh tests/run_tests.sh

      - name: JieLi toolchain and AC79 SDK
        run: |
          sh base/tools/get_toolchain.sh ~/.jieli
          # JieLi's SDK from its gitee repository (as Elixir's and CTL-1's builds take it), only the three files a
          # package needs (no Bluetooth here), checked against the commit fm1-base was tested with
          git clone -q --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 --filter=blob:none --sparse \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/.jieli/ac79-sdk
          git -C ~/.jieli/ac79-sdk sparse-checkout set --no-cone /LICENSE /cpu/wl82/tools/uboot.boot \
              /cpu/wl82/tools/cfg_tool.bin /cpu/wl82/tools/cfg/eq_cfg_hw.bin
          test "$(git -C ~/.jieli/ac79-sdk rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
          ls -la ~/.jieli/ac79-sdk/cpu/wl82/tools/uboot.boot

      - name: Firmware
        run: |
          V="$(cat VERSION)"
          export JIELI_TOOLCHAIN=~/.jieli/toolchain AC79_SDK=~/.jieli/ac79-sdk
          ./build.sh --release "$V" > build/fw.log 2>&1 || { tail -60 build/fw.log; echo "::error title=firmware build::$(tail -c 3000 build/fw.log | tr '\n' '|')"; exit 1; }
          tail -15 build/fw.log
          ls -la app/build/*.fwsc
          echo "V=$V" >> "$GITHUB_ENV"

      - uses: mymindstorm/setup-emsdk@v14

      - name: Browser emulator and site
        run: |
          ./build.sh --web --release "$V" > build/web.log 2>&1 || { tail -40 build/web.log; echo "::error title=web build::$(tail -c 3000 build/web.log | tr '\n' '|')"; exit 1; }
          python3 base/tools/make_site.py app "app/build/jungle-$V.fwsc" "$V" build/site > build/site.log 2>&1 || { cat build/site.log; echo "::error title=site::$(tail -c 3000 build/site.log | tr '\n' '|')"; exit 1; }
          mkdir -p build/site/loader
          cp web/loader/index.html build/site/loader/
          touch build/site/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: jungle-firmware
          path: |
            app/build/jungle-*.fwsc
            build/loader.png

      - name: Publish the site (gh-pages)
        run: |
          cd build/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site for JUNGLE $V (from ${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
